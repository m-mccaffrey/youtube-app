<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search — TV</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      min-height: 100dvh;
    }

    /* ── header ── */
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.7rem 1.2rem;
      background: #111;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header a {
      color: #aaa;
      text-decoration: none;
      font-size: 0.85rem;
    }
    header a:hover { color: #fff; }

    header h1 {
      font-size: 0.95rem;
      font-weight: 600;
      flex: 1;
    }

    #auth-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 99px;
      cursor: default;
    }
    #auth-badge.authorized   { background: #1a3a1a; color: #6dbf6d; }
    #auth-badge.unauthorized { background: #3a1a1a; color: #bf6d6d; cursor: pointer; text-decoration: underline; }
    #auth-badge.unavailable  { background: #2a2a2a; color: #666; }

    /* ── search panel ── */
    #search-panel {
      display: flex;
      gap: 0.8rem;
      padding: 1.2rem;
      align-items: flex-start;
    }

    textarea {
      flex: 1;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.7rem 0.9rem;
      resize: vertical;
      min-height: 90px;
      line-height: 1.5;
      outline: none;
    }
    textarea:focus { border-color: #444; }
    textarea::placeholder { color: #444; }

    #search-controls {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: stretch;
    }

    #suffix-select {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #aaa;
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.45rem 0.7rem;
      outline: none;
      cursor: pointer;
    }
    #suffix-select:focus { border-color: #444; }

    #search-btn {
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.6rem 1.2rem;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #search-btn:hover:not(:disabled) { background: #2e2e2e; }
    #search-btn:disabled { opacity: 0.45; cursor: default; }

    /* ── results ── */
    #results { padding: 0 1.2rem 2rem; }

    .term-section { margin-bottom: 2.2rem; }

    .term-label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 0.8rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #1e1e1e;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
    }

    .card {
      background: #141414;
      border: 1px solid #1e1e1e;
      border-radius: 7px;
      overflow: hidden;
      width: 190px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #333; }

    .card-thumb-wrap {
      position: relative;
      width: 190px;
      height: 107px;
      background: #0e0e0e;
      flex-shrink: 0;
    }

    .card-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-dur {
      position: absolute;
      bottom: 5px;
      right: 6px;
      background: rgba(0,0,0,0.82);
      color: #fff;
      font-size: 0.7rem;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .card-yt-link {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      background: rgba(0,0,0,0.45);
      transition: opacity 0.15s;
      text-decoration: none;
    }
    .card-thumb-wrap:hover .card-yt-link { opacity: 1; }

    .card-yt-link svg {
      width: 38px;
      height: 38px;
      fill: #fff;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,0.6));
    }

    .card-body {
      padding: 0.55rem 0.65rem 0.6rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0.3rem;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-channel {
      font-size: 0.72rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 0.7rem;
      color: #555;
      margin-top: auto;
      padding-top: 0.25rem;
    }

    .card-add {
      margin-top: 0.4rem;
      width: 100%;
      padding: 0.38rem 0;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #bbb;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .card-add:hover:not(:disabled) { background: #282828; color: #fff; }
    .card-add:disabled { opacity: 0.5; cursor: default; }
    .card-add.added   { color: #6dbf6d; border-color: #2a3d2a; }
    .card-add.errored { color: #bf6d6d; border-color: #3d2a2a; }

    .no-results {
      color: #555;
      font-size: 0.85rem;
      font-style: italic;
    }

    #spinner {
      display: none;
      color: #555;
      font-size: 0.85rem;
      padding: 0.5rem 1.2rem;
    }
  </style>
</head>
<body>

<header>
  <a href="/">← TV</a>
  <h1>Search &amp; Add</h1>
  <span id="auth-badge">…</span>
</header>

<div id="search-panel">
  <textarea id="terms-input" placeholder="Radiohead&#10;Jeff Buckley - Hallelujah&#10;Portishead&#10;Massive Attack"></textarea>
  <div id="search-controls">
    <select id="suffix-select" title="Appended to every search term">
      <option value="live performance">+ live performance</option>
      <option value="live">+ live</option>
      <option value="live concert">+ live concert</option>
      <option value="acoustic live">+ acoustic live</option>
      <option value="NPR Tiny Desk">+ NPR Tiny Desk</option>
      <option value="">no suffix</option>
    </select>
    <button id="search-btn">Search</button>
  </div>
</div>

<div id="spinner">Searching…</div>
<div id="results"></div>

<script>
  // ── utils ────────────────────────────────────────────────────────────────
  function parseDuration(iso) {
    if (!iso) return "";
    const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if (!m) return "";
    const h = parseInt(m[1] || 0), min = parseInt(m[2] || 0), s = parseInt(m[3] || 0);
    if (h > 0) return `${h}:${String(min).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    return `${min}:${String(s).padStart(2,"0")}`;
  }

  function fmtCount(n) {
    if (!n) return "—";
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1_000)     return (n / 1_000).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }

  // ── auth status ──────────────────────────────────────────────────────────
  let isAuthorized = false;

  async function checkAuth() {
    const badge = document.getElementById("auth-badge");
    try {
      const st = await fetch("/api/auth-status").then(r => r.json());
      if (!st.oauth_available) {
        badge.textContent = "Add to playlist: pip install google-auth-oauthlib";
        badge.className = "unavailable";
      } else if (!st.client_secrets_exist) {
        badge.textContent = "Add to playlist: client_secrets.json missing";
        badge.className = "unavailable";
      } else if (st.authorized) {
        badge.textContent = "✓ Authorized";
        badge.className = "authorized";
        isAuthorized = true;
      } else {
        badge.textContent = "Authorize YouTube →";
        badge.className = "unauthorized";
        badge.onclick = () => { window.location.href = "/auth"; };
      }
    } catch {
      badge.textContent = "Auth unknown";
      badge.className = "unavailable";
    }
  }

  // ── search ───────────────────────────────────────────────────────────────
  document.getElementById("search-btn").addEventListener("click", runSearch);
  document.getElementById("terms-input").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) runSearch();
  });

  async function runSearch() {
    const terms = document.getElementById("terms-input").value;
    if (!terms.trim()) return;

    const suffix = document.getElementById("suffix-select").value;
    const btn = document.getElementById("search-btn");
    const spinner = document.getElementById("spinner");
    const resultsEl = document.getElementById("results");

    btn.disabled = true;
    spinner.style.display = "block";
    resultsEl.innerHTML = "";

    try {
      const data = await fetch("/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ terms, suffix }),
      }).then(r => r.json());

      renderResults(data);
    } catch (err) {
      resultsEl.innerHTML = `<p style="color:#bf6d6d;padding:1rem">Search failed: ${err.message}</p>`;
    } finally {
      btn.disabled = false;
      spinner.style.display = "none";
    }
  }

  // ── render ───────────────────────────────────────────────────────────────
  function renderResults(data) {
    const el = document.getElementById("results");
    el.innerHTML = "";

    for (const [term, videos] of Object.entries(data)) {
      const section = document.createElement("div");
      section.className = "term-section";

      const label = document.createElement("div");
      label.className = "term-label";
      label.textContent = term;
      section.appendChild(label);

      if (!videos.length) {
        const none = document.createElement("p");
        none.className = "no-results";
        none.textContent = "No embeddable results under 10 minutes found.";
        section.appendChild(none);
      } else {
        const cards = document.createElement("div");
        cards.className = "cards";
        for (const v of videos) cards.appendChild(makeCard(v));
        section.appendChild(cards);
      }

      el.appendChild(section);
    }
  }

  function makeCard(v) {
    const dur = parseDuration(v.duration);

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-thumb-wrap">
        <img src="${v.thumbnail}" alt="" loading="lazy" />
        <span class="card-dur">${dur}</span>
        <a class="card-yt-link" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" title="Watch on YouTube">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </a>
      </div>
      <div class="card-body">
        <div class="card-title" title="${v.title.replace(/"/g,'&quot;')}">${escHtml(v.title)}</div>
        <div class="card-channel">${escHtml(v.channel)}</div>
        <div class="card-meta">▲ ${fmtCount(v.likes)} likes &nbsp;·&nbsp; ${fmtCount(v.views)} views</div>
        <button class="card-add" data-id="${v.id}">＋ Add to playlist</button>
      </div>`;

    card.querySelector(".card-add").addEventListener("click", function () {
      addToPlaylist(v.id, this);
    });

    return card;
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ── add to playlist ──────────────────────────────────────────────────────
  async function addToPlaylist(videoId, btn) {
    if (!isAuthorized) {
      window.location.href = "/auth";
      return;
    }
    btn.disabled = true;
    btn.textContent = "Adding…";

    try {
      const res = await fetch("/api/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ video_id: videoId }),
      });

      if (res.ok) {
        btn.textContent = "✓ Added";
        btn.classList.add("added");
      } else if (res.status === 401) {
        btn.textContent = "Authorize first";
        btn.classList.add("errored");
        btn.disabled = false;
        btn.onclick = () => { window.location.href = "/auth"; };
      } else {
        const err = await res.json();
        btn.textContent = `✗ ${err.error || "Error"}`;
        btn.classList.add("errored");
        btn.disabled = false;
      }
    } catch {
      btn.textContent = "✗ Network error";
      btn.classList.add("errored");
      btn.disabled = false;
    }
  }

  // ── init ─────────────────────────────────────────────────────────────────
  checkAuth();
</script>
</body>
</html>
